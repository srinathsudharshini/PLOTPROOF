services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: plotproof-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plotproof}
      POSTGRES_USER: ${POSTGRES_USER:-plotproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plotproof} -d ${POSTGRES_DB:-plotproof}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - plotproof-network

  redis:
    image: redis:7-alpine
    container_name: plotproof-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - plotproof-network

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: plotproof-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plotproof-network

  worker:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.worker
    container_name: plotproof-worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    networks:
      - plotproof-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: plotproof-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plotproof-network

  minio:
    image: minio/minio:latest
    container_name: plotproof-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - plotproof-network

  clamav:
    image: clamav/clamav:stable
    container_name: plotproof-clamav
    ports:
      - "3310:3310"
    networks:
      - plotproof-network

  nginx:
    image: nginx:alpine
    container_name: plotproof-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - plotproof-network

networks:
  plotproof-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_storage:
